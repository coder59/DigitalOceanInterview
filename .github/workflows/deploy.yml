name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

env:
  APP_DIR: /opt/go-ingestion-api

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./internal/plane/ ./internal/controlplane/ ./internal/dataplane/ ./internal/db/ ./internal/external/ -count=1

      - name: Build binary
        run: CGO_ENABLED=0 go build -o /tmp/api-service ./cmd/api

  deploy:
    name: Deploy via SSH
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${HOST:-}" ] || { echo "Missing secret DROPLET_HOST"; missing=1; }
          [ -n "${USER:-}" ] || { echo "Missing secret DROPLET_USER"; missing=1; }
          [ -n "${KEY:-}" ] || { echo "Missing secret DROPLET_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under Settings → Secrets and variables → Actions (see .env.example)" >&2
            exit 1
          fi

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add droplet to known_hosts
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          PORT: ${{ secrets.DROPLET_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Sync files to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          PORT: ${{ secrets.DROPLET_PORT }}
          REMOTE_DIR: ${{ secrets.DROPLET_APP_DIR }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          REMOTE_DIR="${REMOTE_DIR:-$APP_DIR}"
          ssh -p "$PORT" "$USER@$HOST" "sudo mkdir -p '$REMOTE_DIR' && sudo chown -R \$USER:\$USER '$REMOTE_DIR'"
          rsync -az --delete \
            -e "ssh -p $PORT" \
            --exclude '.git/' \
            --exclude '.tools/' \
            --exclude 'bin/' \
            --exclude 'internal/e2e/' \
            --exclude '.github/' \
            ./ "$USER@$HOST:$REMOTE_DIR/"

      - name: Run remote deploy script
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          PORT: ${{ secrets.DROPLET_PORT }}
          REMOTE_DIR: ${{ secrets.DROPLET_APP_DIR }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          REMOTE_DIR="${REMOTE_DIR:-$APP_DIR}"
          ssh -p "$PORT" "$USER@$HOST" \
            "cd '$REMOTE_DIR' && chmod +x scripts/*.sh && APP_DIR='$REMOTE_DIR' bash scripts/deploy-droplet.sh"

      - name: Smoke test public URL
        env:
          BASE_URL: ${{ secrets.DROPLET_URL }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL:-http://$HOST}"
          echo "Smoke testing $BASE_URL"
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL/health" | grep -q healthy; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "Public health check failed" >&2
              exit 1
            fi
          done
          curl -fsS "$BASE_URL/health"; echo
          curl -fsS "$BASE_URL/api/v1/pool"; echo
          RESP=$(curl -fsS -X POST "$BASE_URL/api/v1/ingest" \
            -H 'Content-Type: application/json' \
            -d '["gha-smoke-1","gha-smoke-2"]')
          echo "$RESP"
          BID=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["batch_id"])')
          for i in $(seq 1 30); do
            ST=$(curl -fsS "$BASE_URL/api/v1/ingest/batches/$BID")
            echo "$ST"
            echo "$ST" | grep -q '"status":"completed"' && break
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo "Batch did not complete" >&2
              exit 1
            fi
          done
          curl -fsS "$BASE_URL/api/v1/ingest/batches/$BID/results"; echo
          echo "Smoke OK"
