services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: ingest_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ingest_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ingest

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:securepassword@postgres:5432/ingest_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - ingest
    restart: on-failure

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - ingest

networks:
  ingest:
    driver: bridge

volumes:
  pgdata:
